[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:java]
command=java -cp /app/java/classes:/app/java/lib/* com.fintrust.server.StandaloneServer
directory=/app
environment=JAVA_SERVICE_PORT="8080"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php]
command=/bin/sh -c 'php /app/database/migrate.php && exec php -S 0.0.0.0:${PORT:-10000} -t /app/php-service/public /app/php-service/public/index.php'
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
